name: Approved review verification
on:
  push:
    branches: [apex/restore-lab-release-gates-20261105]
permissions:
  contents: read
concurrency:
  group: approved-box3d-review
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/apex/restore-lab-release-gates-20261105'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update guarded workflow-closure assertions and browser pin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('scripts/self-test.mjs'); text=p.read_text()
          start=text.find("assert.match(read('.github/workflows/ci.yml'), /npm (run validate|test)/")
          if start >= 0:
              end=text.index('\nfor (const releaseDocument',start)
              text=text[:start]+'''// Workflows invoke one shared executable gate; inspect its closure instead
          // of requiring duplicate inline commands in every YAML file.
          const sharedReleaseGate = read('scripts/validate-release.mjs');
          const releasePackage = JSON.parse(read('package.json'));
          assert.equal(releasePackage.scripts['validate:release'], 'node scripts/validate-release.mjs');
          for (const workflow of workflows) {
            assert.match(read(workflow), /run: npm run validate:release/, `${workflow} must invoke the shared release gate`);
          }
          for (const command of ['verify:source', 'typecheck', 'test:cbridge', 'test:webgpu', 'test:collision', 'test:assets', 'test:engine', 'test:studio', 'test:studio:presets', 'test:studio:river', 'test:studio:reference', 'test:studio:press', 'test:soft-soak:all', 'test:rope-batching', 'test:native-wasm', 'test:material:100', 'build', 'build:pages', 'test:browser:release']) {
            assert.ok(releasePackage.scripts[command], `Missing executable package script ${command}`);
            assert.ok(sharedReleaseGate.includes(`'${command}'`), `Shared release gate must execute ${command}`);
          }
          for (const suite of ['unit', 'engineering-evidence', 'execution-graph', 'water-reference', 'water-surface-plan', 'projection-depth', 'instance-visibility']) assert.ok(sharedReleaseGate.includes(`'${suite}'`), `Shared release gate must retain ${suite}`);
          for (const file of ['scripts/self-test.mjs', 'scripts/soft-kernel-test.mjs', 'scripts/soft-kernel-integration-test.cjs']) assert.ok(sharedReleaseGate.includes(file), `Shared release gate must retain ${file}`);
          assert.match(sharedReleaseGate, /audit.*--audit-level=moderate/, 'Shared release gate must retain dependency audit');
          assert.ok(sharedReleaseGate.lastIndexOf("gate('verify:source')") > sharedReleaseGate.indexOf("gate('verify:source')"), 'Source integrity must be verified before and after validation');
          '''+text[end:]
              p.write_text(text)
          p=Path('package.json'); pkg=json.loads(p.read_text()); pkg['devDependencies']['playwright']='1.64.1'; p.write_text(json.dumps(pkg,indent=2)+'\n')
          PY
          npm install --package-lock-only --ignore-scripts
      - name: Refresh exact manifest on task branch only
        id: source
        run: |
          bash scripts/generate-source-manifest.sh
          git add scripts/self-test.mjs package.json package-lock.json SOURCE_MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git -c user.name='APEX review integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Verify shared release closure and pin Playwright 1.64.1'
            git push origin HEAD:refs/heads/apex/restore-lab-release-gates-20261105
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Shared complete release gate
        env:
          BOX3D_QA_OUTPUT: ${{ runner.temp }}/box3d-review-qa
        run: |
          mkdir -p "$BOX3D_QA_OUTPUT"
          set -o pipefail
          npm run validate:release 2>&1 | tee "$BOX3D_QA_OUTPUT/release.log"
      - name: Concise gate receipts
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/box3d-review-qa/release-gates.json" || cat "$RUNNER_TEMP/box3d-review-qa/release-gates.json"
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box3d-review-validation
          path: ${{ runner.temp }}/box3d-review-qa
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages && npm run stage:railway
      - name: Actual software-browser application checks
        env:
          BOX3D_QA_OUTPUT: ${{ runner.temp }}/box3d-browser-qa
        run: npm run test:browser:release
      - name: Browser receipts
        if: always()
        run: test ! -f "$RUNNER_TEMP/box3d-browser-qa/browser-release.json" || cat "$RUNNER_TEMP/box3d-browser-qa/browser-release.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box3d-browser-validation
          path: ${{ runner.temp }}/box3d-browser-qa
          retention-days: 7
