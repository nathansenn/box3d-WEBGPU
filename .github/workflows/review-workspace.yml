name: Approved review verification
on:
  push:
    branches: [apex/restore-lab-release-gates-20261105]
permissions:
  contents: read
concurrency:
  group: approved-box3d-review
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/apex/restore-lab-release-gates-20261105'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded subpath contract and notice integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/self-test.mjs'); text=p.read_text()
          old=next((line for line in text.splitlines() if 'index.html must link the ${study} study' in line), None)
          if old:
              text=text.replace(old, '''  const links = [...html.matchAll(/href=["']([^"']+)["']/g)].map(match => match[1]);
            for (const base of ['https://example.test/', 'https://example.test/box3d-WEBGPU/']) {
              assert.ok(links.some(href => {
                const target = new URL(href, base);
                return target.origin === new URL(base).origin && target.pathname === new URL(base).pathname && target.searchParams.get('studio') === study;
              }), `Studio navigation must preserve deployment base: ${study} at ${base}`);
            }''')
              text=text.replace('The AAA showcase UI in src/main.ts is no longer linked from it.', 'The AAA showcase has its own compatible lab.html shell and entry.')
              p.write_text(text)
          p=Path('vite.config.ts'); text=p.read_text()
          if 'box3d-license-notices' not in text:
              text=text.replace("import { fileURLToPath } from 'node:url';", "import { fileURLToPath } from 'node:url';\nimport { readFileSync } from 'node:fs';")
              text=text.replace('export default defineConfig({', '''export default defineConfig({
            plugins: [{
              name: 'box3d-license-notices',
              generateBundle() {
                for (const [fileName, sourceFile] of [['licenses/project.txt', 'LICENSE'], ['licenses/third-party.txt', 'THIRD_PARTY_NOTICES.md']]) {
                  this.emitFile({ type: 'asset', fileName, source: readFileSync(new URL('./' + sourceFile, import.meta.url), 'utf8') });
                }
              },
            }],''')
              p.write_text(text)
          PY
      - name: Refresh exact manifest on task branch only
        id: source
        run: |
          bash scripts/generate-source-manifest.sh
          git add scripts/self-test.mjs vite.config.ts SOURCE_MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git -c user.name='APEX review integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Verify subpath-safe navigation and emit project license notices'
            git push origin HEAD:refs/heads/apex/restore-lab-release-gates-20261105
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Shared complete release gate
        env:
          BOX3D_QA_OUTPUT: ${{ runner.temp }}/box3d-review-qa
        run: |
          mkdir -p "$BOX3D_QA_OUTPUT"
          set -o pipefail
          npm run validate:release 2>&1 | tee "$BOX3D_QA_OUTPUT/release.log"
      - name: Concise gate receipts
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/box3d-review-qa/release-gates.json" || cat "$RUNNER_TEMP/box3d-review-qa/release-gates.json"
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box3d-review-validation
          path: ${{ runner.temp }}/box3d-review-qa
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages && npm run stage:railway
      - name: Actual software-browser application checks
        env:
          BOX3D_QA_OUTPUT: ${{ runner.temp }}/box3d-browser-qa
        run: npm run test:browser:release
      - name: Browser receipts
        if: always()
        run: test ! -f "$RUNNER_TEMP/box3d-browser-qa/browser-release.json" || cat "$RUNNER_TEMP/box3d-browser-qa/browser-release.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box3d-browser-validation
          path: ${{ runner.temp }}/box3d-browser-qa
          retention-days: 7
