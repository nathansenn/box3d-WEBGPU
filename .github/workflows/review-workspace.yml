name: Approved review verification
on:
  push:
    branches: [apex/restore-lab-release-gates-20261105]
permissions:
  contents: read
concurrency:
  group: approved-box3d-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/apex/restore-lab-release-gates-20261105'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh exact manifest on task branch only
        run: |
          bash scripts/generate-source-manifest.sh
          git add SOURCE_MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git -c user.name='APEX review integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh source manifest for approved integration'
            git push origin HEAD:refs/heads/apex/restore-lab-release-gates-20261105
          fi
          git rev-parse HEAD
      - name: Install acceptance browser
        run: npx playwright install --with-deps chromium
      - name: Validate approved integration
        env:
          BOX3D_QA_OUTPUT: ${{ runner.temp }}/box3d-review-qa
        run: |
          mkdir -p "$BOX3D_QA_OUTPUT"
          set -o pipefail
          npm run validate:release 2>&1 | tee "$BOX3D_QA_OUTPUT/release.log"
      - name: Export change set and source identity
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/box3d-review-qa"
          git fetch --depth=1 origin 90dbd05929a48a93716d3dfd46a7fd7931baa5a8
          git diff 90dbd05929a48a93716d3dfd46a7fd7931baa5a8 HEAD --binary > "$RUNNER_TEMP/box3d-review-qa/changes.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/box3d-review-qa/tested-commit.txt"
          git status --short > "$RUNNER_TEMP/box3d-review-qa/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box3d-review-validation
          path: ${{ runner.temp }}/box3d-review-qa
          retention-days: 7
  contact-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Measure bounded contacts without changing solvers
        env:
          BOX3D_CONTACT_OUTPUT: ${{ runner.temp }}/contact-budget.json
          BOX3D_CONTACT_TIMEOUT_MS: '15000'
        run: npm run bench:contact-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box3d-contact-baseline
          path: ${{ runner.temp }}/contact-budget.json
          retention-days: 7
