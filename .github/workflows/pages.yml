name: Deploy WebGPU Demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Validate and build both applications
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for software-rendered browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Shared Studio, Lab, engine, browser, and production release gate
        env:
          BOX3D_QA_OUTPUT: ${{ runner.temp }}/box3d-release-qa
        run: npm run validate:release
      - name: Keep release QA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box3d-pages-qa
          path: ${{ runner.temp }}/box3d-release-qa
          if-no-files-found: warn
          retention-days: 7
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
