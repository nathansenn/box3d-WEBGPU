name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    name: Studio and Physics Lab release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for software-rendered browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Shared Studio, Lab, engine, browser, and production release gate
        env:
          BOX3D_QA_OUTPUT: ${{ runner.temp }}/box3d-release-qa
        run: npm run validate:release
      - name: Keep release QA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box3d-release-qa
          path: ${{ runner.temp }}/box3d-release-qa
          if-no-files-found: warn
          retention-days: 7
