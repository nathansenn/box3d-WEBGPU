name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    # The required check. Same name as before so existing branch rules keep matching.
    name: Typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull-request gate (core, packaged runtimes, both builds, Railway staging)
        env:
          BOX3D_QA_OUTPUT: ${{ runner.temp }}/box3d-release-qa
        run: npm run validate:pr

  studio:
    # The long Studio suites run on main and on manual runs, not on every pull request.
    name: Studio suites
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Studio gate
        env:
          BOX3D_QA_OUTPUT: ${{ runner.temp }}/box3d-release-qa
        run: npm run validate:studio

  engine:
    # Reported, not blocking: most failures need evidence files that are not in the repository yet.
    name: Engine suite (reported)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The engine benchmark harness needs Node 24 (native TypeScript stripping and registerHooks).
          node-version: 24
          cache: npm
      - run: npm ci
      - id: suite
        name: Engine suite
        continue-on-error: true
        run: npm run test:engine
      - name: Report the result
        if: always()
        run: |
          if [ "${{ steps.suite.outcome }}" = "success" ]; then
            echo "### Engine suite: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Engine suite failing (not blocking)::See the Engine suite step. Most failures need benchmarks/results/engine-100x and two benchmarks/baselines archives, which are not in the repository yet."
            echo "### Engine suite: failing (not blocking)" >> "$GITHUB_STEP_SUMMARY"
          fi

  browser:
    # Reported, not blocking until the Studio console errors it finds are fixed.
    name: Browser acceptance (reported)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for software-rendered browser acceptance
        # The system packages come from Ubuntu's mirrors, which the runner sometimes cannot resolve
        # for a minute or two. Retry before giving up, so a network blip isn't reported as a failure.
        run: |
          for attempt in 1 2 3 4; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Chromium install attempt $attempt failed; retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          exit 1
      - id: suite
        name: Browser acceptance
        continue-on-error: true
        env:
          BOX3D_QA_OUTPUT: ${{ runner.temp }}/box3d-release-qa
        run: npm run build:pages && npm run test:browser:release
      - name: Report the result
        if: always()
        run: |
          if [ "${{ steps.suite.outcome }}" = "success" ]; then
            echo "### Browser acceptance: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Browser acceptance failing (not blocking)::See the Browser acceptance step and the box3d-browser-qa artifact."
            echo "### Browser acceptance: failing (not blocking)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep browser QA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box3d-browser-qa
          path: ${{ runner.temp }}/box3d-release-qa
          if-no-files-found: warn
          retention-days: 7
