name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify source manifest
        run: npm run verify:source

      - name: Test application and packaged WebAssembly runtimes
        run: |
          # Portable expansion of npm run validate:v1.20; packaged runtime tests replace the release-toolchain byte rebuild.
          npm run typecheck
          rm -rf .test-build
          npx tsc -p tsconfig.test.json
          node -e "require('fs').mkdirSync('.test-build', {recursive:true}); require('fs').writeFileSync('.test-build/package.json', '{\"type\":\"commonjs\"}')"
          node .test-build/tests/unit.test.js
          node .test-build/tests/engineering-evidence.test.js
          node scripts/self-test.mjs
          npm run test:cbridge
          node scripts/soft-kernel-test.mjs
          rm -rf .test-build
          npx tsc -p tsconfig.test.json
          node -e "require('fs').mkdirSync('.test-build', {recursive:true}); require('fs').writeFileSync('.test-build/package.json', '{\"type\":\"commonjs\"}')"
          node scripts/soft-kernel-integration-test.cjs
          npm run test:webgpu
          npm run test:collision
          npm run test:assets

      - name: Validate v1.20 AAA programs, material, soft, native, and production gates
        run: |
          npm run test:soft-soak:all
          npm run test:rope-batching
          npm run test:native-wasm
          npm run test:material:100
          npm run build
          npm run build:pages
          npm audit --audit-level=moderate

      - name: Confirm validation did not mutate tracked artifacts
        run: npm run verify:source
